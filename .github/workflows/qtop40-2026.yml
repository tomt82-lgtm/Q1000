
name: Update Q-Top 40 (alle jaren vanaf 2026)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * 5'
    - cron: '15 9 * * 6'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Q-Top 40
        run: python update_qtop40_2026.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update Q-Top 40 annual and all-years"
            git push
          fi
